<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>タイピング流星群（フリック版）</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05060f; height: 100%;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #gameArea { position: relative; width: 100%; }
  #ui {
    position: absolute; inset: 0; pointer-events: none;
    font-family: "Yu Gothic", "Meiryo", sans-serif; color: #dfe6ff;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(5, 6, 15, 0.8); pointer-events: auto; text-align: center;
    padding: 0 20px;
  }
  .overlay h1 { font-size: 34px; margin: 0; letter-spacing: 4px;
    background: linear-gradient(180deg, #9fd4ff, #4a7dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(90, 140, 255, 0.35); }
  .overlay p { font-size: 14px; line-height: 1.8; color: #aab6e0; margin: 0; }
  .overlay .big { font-size: 24px; color: #ffd579; }
  .overlay .press { font-size: 16px; color: #dfe6ff; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #hud {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 16px;
    font-size: 16px; text-shadow: 0 0 8px #000;
  }
  #combo {
    position: absolute; top: 38px; right: 16px; font-size: 13px; color: #ffd579;
    text-shadow: 0 0 8px #000;
  }
  .hidden { display: none !important; }

  #keypad {
    flex: 0 0 auto; background: #0a0d1c; border-top: 1px solid rgba(120,160,255,0.25);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  #keypadGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .key {
    position: relative; background: linear-gradient(180deg, #1c2340, #131628);
    border: 1px solid rgba(120,160,255,0.3); border-radius: 10px;
    color: #eef3ff; font-family: "Yu Gothic", "Meiryo", sans-serif;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; aspect-ratio: 1.5 / 1;
    touch-action: none; user-select: none;
  }
  .key.mod { font-size: 18px; color: #ffd579; }
  .key .hint {
    position: absolute; font-size: 10px; font-weight: normal; color: #6f7fb0;
  }
  .key .hint.up { top: 3px; left: 50%; transform: translateX(-50%); }
  .key .hint.right { right: 5px; top: 50%; transform: translateY(-50%); }
  .key .hint.down { bottom: 3px; left: 50%; transform: translateX(-50%); }
  .key .hint.left { left: 5px; top: 50%; transform: translateY(-50%); }
  .key.active { background: linear-gradient(180deg, #2a3560, #1a2040); }
  #flickPreview {
    position: fixed; pointer-events: none; z-index: 50;
    background: rgba(255, 213, 121, 0.95); color: #1a1a1a;
    font-weight: bold; font-size: 20px; padding: 6px 12px; border-radius: 8px;
    transform: translate(-50%, -130%); display: none;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
  }
</style>
</head>
<body style="display:flex; flex-direction:column; height:100dvh;">
<div id="gameArea">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud" class="hidden">
      <span id="score">SCORE 0</span>
      <span id="level">LV 1</span>
      <span id="hp"></span>
    </div>
    <div id="combo" class="hidden"></div>
    <div id="title" class="overlay">
      <h1>タイピング流星群<br>フリック版</h1>
      <p>単語の流星が降ってくる。<br>下のキーパッドをフリックして、かなを打ち込め！<br>
      濁点・小文字にしたい時は、<b>打ったあとで</b>「゛」「小」を押してね。</p>
      <p class="press">タップしてスタート</p>
    </div>
    <div id="gameover" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p class="big" id="finalScore"></p>
      <p id="finalStats"></p>
      <p class="press">タップしてもう一度</p>
    </div>
  </div>
</div>
<div id="keypad">
  <div id="keypadGrid"></div>
</div>
<div id="flickPreview"></div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const gameArea = document.getElementById("gameArea");
const keypad = document.getElementById("keypad");
let W, H;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = Math.max(220, innerHeight - keypad.offsetHeight);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  gameArea.style.height = H + "px";
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 200));

// フリックの行データ: [タップ, 上, 右, 下, 左] （空文字はその方向が存在しないキー）
// 実機iOSのフリック配列に合わせて、上=う段、右=え段、下=お段、左=い段
const ROWS = {
  "あ": ["あ","う","え","お","い"],
  "か": ["か","く","け","こ","き"],
  "さ": ["さ","す","せ","そ","し"],
  "た": ["た","つ","て","と","ち"],
  "な": ["な","ぬ","ね","の","に"],
  "は": ["は","ふ","へ","ほ","ひ"],
  "ま": ["ま","む","め","も","み"],
  "や": ["や","ゆ","","よ",""],
  "ら": ["ら","る","れ","ろ","り"],
  "わ": ["わ","ん","","",""],
};
const ROW_ORDER = ["あ","か","さ","た","な","は","ま","や","ら"];
const DAKUTEN = {
  "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご",
  "さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ",
  "た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど",
  "は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ",
};
const SMALL = { "つ":"っ", "や":"ゃ", "ゆ":"ゅ", "よ":"ょ" };

// 単語プール: tier 0 = 短い, 2 = 長い（漢字とかなのペア）
const WORD_SOURCE = [
  [
    ["星","ほし"],["月","つき"],["空","そら"],["雨","あめ"],["風","かぜ"],
    ["夢","ゆめ"],["海","うみ"],["山","やま"],["花","はな"],["雪","ゆき"],
    ["音","おと"],["夜","よる"],["光","ひかり"],["朝","あさ"],["炎","ほのお"],
  ],
  [
    ["流星","りゅうせい"],["宇宙","うちゅう"],["銀河","ぎんが"],["彗星","すいせい"],
    ["惑星","わくせい"],["星座","せいざ"],["隕石","いんせき"],["衛星","えいせい"],
    ["太陽","たいよう"],["重力","じゅうりょく"],["軌道","きどう"],["満月","まんげつ"],
    ["北極星","ほっきょくせい"],["天の川","あまのがわ"],
  ],
  [
    ["流れ星","ながれぼし"],["望遠鏡","ぼうえんきょう"],["大気圏","たいきけん"],
    ["天文台","てんもんだい"],["無重力","むじゅうりょく"],["超新星","ちょうしんせい"],
    ["人工衛星","じんこうえいせい"],["宇宙飛行士","うちゅうひこうし"],
    ["天体観測","てんたいかんそく"],["星屑","ほしくず"],
  ],
];
const WORDS = WORD_SOURCE.map(tier => tier.map(([jp, kana]) => {
  const units = Array.from(kana);
  return { jp, kana, units, heads: [units[0]] };
}));

// 星空の背景
const stars = Array.from({length: 120}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.4 + 0.3, tw: Math.random() * Math.PI * 2,
}));

const GROUND_H = 56;
let state = "title"; // title | play | over
let meteors, particles, floaters, score, combo, maxCombo, kills, level, hp;
let spawnTimer, spawnInterval, lockedMeteor, shake, lastTime;
let pendingBase = null; // 「゛」「小」での変換待ちの、まだ確定していないかな

function reset() {
  meteors = []; particles = []; floaters = [];
  score = 0; combo = 0; maxCombo = 0; kills = 0; level = 1; hp = 5;
  spawnTimer = 0; spawnInterval = 2.6; lockedMeteor = null; shake = 0;
  pendingBase = null;
  updateHud();
}

const TIER_WEIGHT = [3, 2, 1];

function pickWord() {
  const maxTier = level >= 6 ? 2 : level >= 3 ? 1 : 0;
  const active = new Set(meteors.flatMap(m => m.word.heads));
  const pool = [];
  for (let t = 0; t <= maxTier; t++) {
    for (let i = 0; i < TIER_WEIGHT[t]; i++) pool.push(...WORDS[t]);
  }
  const candidates = pool.filter(w => !w.heads.some(h => active.has(h)));
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function spawnMeteor() {
  const word = pickWord();
  if (!word) return false;
  const x = 50 + Math.random() * (W - 100);
  meteors.push({
    word, unitIdx: 0, x, y: -30,
    vx: (Math.random() - 0.5) * 20,
    vy: (26 + level * 5) * (0.85 + Math.random() * 0.3),
    trail: [],
  });
  return true;
}

function explode(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 200;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.6, age: 0, color,
      r: 1.5 + Math.random() * 2.5,
    });
  }
}

function floatText(x, y, text, color) {
  floaters.push({ x, y, text, color, age: 0, life: 0.9 });
}

function killMeteor(m) {
  const idx = meteors.indexOf(m);
  if (idx >= 0) meteors.splice(idx, 1);
  combo++;
  maxCombo = Math.max(maxCombo, combo);
  kills++;
  const pts = m.word.units.length * 25 * Math.min(combo, 10);
  score += pts;
  explode(m.x, m.y, "#7fc4ff", 24);
  explode(m.x, m.y, "#ffd579", 12);
  floatText(m.x, m.y - 18, "+" + pts, "#ffd579");
  if (kills % 8 === 0) {
    level++;
    spawnInterval = Math.max(0.85, spawnInterval - 0.18);
    floatText(W / 2, H * 0.3, "LEVEL " + level + "!", "#9fd4ff");
  }
  updateHud();
}

function meteorImpact(m) {
  const idx = meteors.indexOf(m);
  if (idx >= 0) meteors.splice(idx, 1);
  if (lockedMeteor === m) lockedMeteor = null;
  hp--; combo = 0; shake = 12;
  explode(m.x, H - GROUND_H, "#ff7a5c", 30);
  updateHud();
  if (hp <= 0) gameOver();
}

function updateHud() {
  document.getElementById("score").textContent = "SCORE " + score;
  document.getElementById("level").textContent = "LV " + level;
  document.getElementById("hp").textContent = "♥".repeat(Math.max(0, hp)) + "♡".repeat(5 - Math.max(0, hp));
  const comboEl = document.getElementById("combo");
  if (combo >= 2) { comboEl.classList.remove("hidden"); comboEl.textContent = combo + " COMBO!"; }
  else comboEl.classList.add("hidden");
}

function gameOver() {
  state = "over";
  document.getElementById("finalScore").textContent = "SCORE " + score;
  document.getElementById("finalStats").textContent =
    "撃墜 " + kills + " ／ 最大コンボ " + maxCombo + " ／ 到達レベル " + level;
  document.getElementById("gameover").classList.remove("hidden");
  document.getElementById("hud").classList.add("hidden");
}

function startGame() {
  reset();
  state = "play";
  document.getElementById("title").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
}

document.getElementById("title").addEventListener("pointerdown", () => { if (state !== "play") startGame(); });
document.getElementById("gameover").addEventListener("pointerdown", () => { if (state !== "play") startGame(); });

// ===== かな入力の判定 =====
// 「゛」「小」は打った直後のかなを後から変換する方式（実機のIMEに近い動き）。
// なので、素の文字が違っても「濁点/小文字にすれば合う」場合は即ミスにせず、
// 変換キーが来るのを1文字ぶんだけ待つ（pendingBase）。
function advanceOrKill(m) {
  m.unitIdx++;
  if (m.unitIdx >= m.word.units.length) { killMeteor(m); lockedMeteor = null; }
}

function commitPendingAsMiss() {
  if (pendingBase !== null) {
    pendingBase = null;
    combo = 0; shake = Math.max(shake, 4); updateHud();
  }
}

// 素のかな（フリックで出た文字そのまま）を1つ入力する
function inputKana(base) {
  if (state !== "play") return;
  if (pendingBase !== null) commitPendingAsMiss();
  if (lockedMeteor && !meteors.includes(lockedMeteor)) lockedMeteor = null;

  if (!lockedMeteor) {
    const exact = meteors.filter(m => m.word.units[m.unitIdx] === base).sort((a, b) => b.y - a.y);
    if (exact.length) { lockedMeteor = exact[0]; advanceOrKill(lockedMeteor); return; }
    const pendable = meteors
      .filter(m => DAKUTEN[base] === m.word.units[m.unitIdx] || SMALL[base] === m.word.units[m.unitIdx])
      .sort((a, b) => b.y - a.y);
    if (pendable.length) { lockedMeteor = pendable[0]; pendingBase = base; return; }
    combo = 0; shake = Math.max(shake, 4); updateHud();
    return;
  }

  const m = lockedMeteor;
  const want = m.word.units[m.unitIdx];
  if (base === want) { advanceOrKill(m); return; }
  if (DAKUTEN[base] === want || SMALL[base] === want) { pendingBase = base; return; }
  combo = 0; shake = Math.max(shake, 4); updateHud();
}

// 「゛」または「小」で、直前に打ったかなを変換して確定する
function applyModifier(kind) {
  if (state !== "play" || pendingBase === null || !lockedMeteor) return;
  const modified = kind === "dakuten" ? DAKUTEN[pendingBase] : SMALL[pendingBase];
  pendingBase = null;
  if (modified && modified === lockedMeteor.word.units[lockedMeteor.unitIdx]) {
    advanceOrKill(lockedMeteor);
  } else {
    combo = 0; shake = Math.max(shake, 4); updateHud();
  }
}

// ===== キーパッド構築 =====
const keypadGrid = document.getElementById("keypadGrid");
const preview = document.getElementById("flickPreview");
const TAP_THRESHOLD = 16;

function dirIndexFromDelta(dx, dy) {
  if (Math.hypot(dx, dy) < TAP_THRESHOLD) return 0;
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 2 : 4;
  return dy > 0 ? 3 : 1;
}

function makeRowKey(rowKey, container) {
  const el = document.createElement("div");
  el.className = "key";
  const row = ROWS[rowKey];
  el.innerHTML =
    `<span class="center">${row[0]}</span>` +
    (row[1] ? `<span class="hint up">${row[1]}</span>` : "") +
    (row[2] ? `<span class="hint right">${row[2]}</span>` : "") +
    (row[3] ? `<span class="hint down">${row[3]}</span>` : "") +
    (row[4] ? `<span class="hint left">${row[4]}</span>` : "");
  container.appendChild(el);

  let start = null;
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    start = { x: e.clientX, y: e.clientY };
    el.setPointerCapture(e.pointerId);
    el.classList.add("active");
    showPreview(e.clientX, e.clientY, row[0]);
  });
  el.addEventListener("pointermove", (e) => {
    if (!start) return;
    const idx = dirIndexFromDelta(e.clientX - start.x, e.clientY - start.y);
    showPreview(e.clientX, e.clientY, row[idx] || row[0]);
  });
  const finish = (e) => {
    if (!start) return;
    const idx = dirIndexFromDelta(e.clientX - start.x, e.clientY - start.y);
    const base = row[idx];
    el.classList.remove("active");
    hidePreview();
    start = null;
    if (base) inputKana(base);
  };
  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", () => { start = null; el.classList.remove("active"); hidePreview(); });
}

function showPreview(x, y, text) {
  preview.style.display = "block";
  preview.style.left = x + "px";
  preview.style.top = y + "px";
  preview.textContent = text;
}
function hidePreview() { preview.style.display = "none"; }

function makeModifierKey(label, onTap) {
  const el = document.createElement("div");
  el.className = "key mod";
  el.textContent = label;
  keypadGrid.appendChild(el);
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.classList.add("active"); });
  el.addEventListener("pointerup", () => { el.classList.remove("active"); onTap(); });
  el.addEventListener("pointercancel", () => el.classList.remove("active"));
}

// 配置: あかさ/たなは/まやら/小・わ・゛ の3列4行
for (const k of ROW_ORDER) makeRowKey(k, keypadGrid);
makeModifierKey("小", () => applyModifier("small"));
makeRowKey("わ", keypadGrid);
makeModifierKey("゛", () => applyModifier("dakuten"));

function update(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnTimer = spawnMeteor() ? spawnInterval : 0.3; }

  for (const m of [...meteors]) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < 40) m.vx = Math.abs(m.vx);
    if (m.x > W - 40) m.vx = -Math.abs(m.vx);
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 12) m.trail.shift();
    if (m.y >= H - GROUND_H) meteorImpact(m);
  }

  for (const p of [...particles]) {
    p.age += dt;
    if (p.age >= p.life) { particles.splice(particles.indexOf(p), 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 220 * dt; p.vx *= 0.985;
  }

  for (const f of [...floaters]) {
    f.age += dt;
    if (f.age >= f.life) floaters.splice(floaters.indexOf(f), 1);
    f.y -= 40 * dt;
  }

  shake = Math.max(0, shake - dt * 30);
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#05060f";
  ctx.fillRect(0, 0, W, H);

  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.001 + s.tw));
    ctx.fillStyle = `rgba(220, 230, 255, ${a * 0.8})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const gy = H - GROUND_H;
  const grad = ctx.createLinearGradient(0, gy, 0, H);
  grad.addColorStop(0, "#1b2440");
  grad.addColorStop(1, "#0a0e1e");
  ctx.fillStyle = grad;
  ctx.fillRect(0, gy, W, GROUND_H);
  ctx.strokeStyle = "rgba(120, 160, 255, 0.5)";
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();

  for (const m of meteors) {
    for (let i = 0; i < m.trail.length; i++) {
      const p = m.trail[i], f = i / m.trail.length;
      ctx.fillStyle = `rgba(120, 180, 255, ${f * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7 * f, 0, Math.PI * 2);
      ctx.fill();
    }
    const locked = m === lockedMeteor;
    ctx.save();
    ctx.shadowColor = locked ? "#ffd579" : "#6fa8ff";
    ctx.shadowBlur = 16;
    ctx.fillStyle = locked ? "#ffe9b0" : "#cfe2ff";
    ctx.beginPath();
    ctx.arc(m.x, m.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.textAlign = "center";
    ctx.font = "bold 18px 'Yu Gothic', 'Meiryo', sans-serif";
    ctx.fillStyle = locked ? "#ffd579" : "#eef3ff";
    ctx.shadowColor = "#000"; ctx.shadowBlur = 6;
    ctx.fillText(m.word.jp, m.x, m.y - 24);
    ctx.shadowBlur = 0;

    ctx.font = "14px 'Yu Gothic', 'Meiryo', sans-serif";
    const done = m.word.units.slice(0, m.unitIdx).join("");
    const pending = locked && pendingBase ? pendingBase : "";
    const rest = m.word.units.slice(m.unitIdx + (pending ? 1 : 0)).join("");
    const wDone = ctx.measureText(done).width;
    const wPending = ctx.measureText(pending).width;
    const wRest = ctx.measureText(rest).width;
    const startX = m.x - (wDone + wPending + wRest) / 2;
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd579";
    ctx.fillText(done, startX, m.y + 24);
    if (pending) {
      ctx.fillStyle = "rgba(255, 213, 121, 0.55)";
      ctx.fillText(pending, startX + wDone, m.y + 24);
      ctx.strokeStyle = "rgba(255, 213, 121, 0.55)";
      ctx.beginPath();
      ctx.moveTo(startX + wDone, m.y + 27);
      ctx.lineTo(startX + wDone + wPending, m.y + 27);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(200, 215, 255, 0.85)";
    ctx.fillText(rest, startX + wDone + wPending, m.y + 24);
  }

  for (const p of particles) {
    const a = 1 - p.age / p.life;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.age / f.life;
    ctx.font = "bold 18px 'Yu Gothic', sans-serif";
    ctx.fillStyle = f.color;
    ctx.shadowColor = "#000"; ctx.shadowBlur = 5;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function loop(t) {
  const dt = Math.min(0.05, (t - (lastTime || t)) / 1000);
  lastTime = t;
  if (state === "play") update(dt);
  draw(t);
  requestAnimationFrame(loop);
}
resize();
reset();

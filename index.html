<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タイピング流星群</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05060f; height: 100%; }
  canvas { display: block; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Yu Gothic", "Meiryo", sans-serif; color: #dfe6ff;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(5, 6, 15, 0.75); pointer-events: auto; text-align: center;
  }
  .overlay h1 { font-size: 52px; margin: 0; letter-spacing: 8px;
    background: linear-gradient(180deg, #9fd4ff, #4a7dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(90, 140, 255, 0.35); }
  .overlay p { font-size: 16px; line-height: 1.9; color: #aab6e0; margin: 0; }
  .overlay .big { font-size: 30px; color: #ffd579; }
  .overlay .press { font-size: 18px; color: #dfe6ff; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #titleBest { font-size: 14px; color: #7fa0d0; margin: 0; }
  #highScoreList {
    width: 100%; max-width: 280px; font-size: 14px; color: #aab6e0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .hs-row { display: flex; justify-content: space-between; padding: 3px 10px; border-radius: 6px; }
  .hs-mine { color: #ffd579; font-weight: bold; background: rgba(255, 213, 121, 0.12); }
  #hud {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 24px;
    font-size: 20px; text-shadow: 0 0 8px #000;
  }
  #combo {
    position: absolute; top: 52px; right: 24px; font-size: 16px; color: #ffd579;
    text-shadow: 0 0 8px #000;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <span id="score">SCORE 0</span>
    <span id="level">LEVEL 1</span>
    <span id="hp"></span>
  </div>
  <div id="combo" class="hidden"></div>
  <div id="title" class="overlay">
    <h1>タイピング流星群</h1>
    <p>単語の流星が降ってくる。<br>ローマ字でタイプして、地上に落ちる前に撃ち落とせ！<br>ミスタイプでコンボが途切れる。地面に落ちるとハートが減る。</p>
    <p id="titleBest"></p>
    <p class="press">スペースキーでスタート</p>
  </div>
  <div id="gameover" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p class="big" id="finalScore"></p>
    <p id="finalStats"></p>
    <div id="highScoreList"></div>
    <p class="press">スペースキーでもう一度</p>
  </div>
</div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener("resize", resize); resize();

// かな→ローマ字テーブル（先頭の綴りが画面表示用。以降は別綴りとして入力可）
const KANA = {
  "あ":["a"],"い":["i"],"う":["u"],"え":["e"],"お":["o"],
  "か":["ka"],"き":["ki"],"く":["ku"],"け":["ke"],"こ":["ko"],
  "さ":["sa"],"し":["shi","si"],"す":["su"],"せ":["se"],"そ":["so"],
  "た":["ta"],"ち":["chi","ti"],"つ":["tsu","tu"],"て":["te"],"と":["to"],
  "な":["na"],"に":["ni"],"ぬ":["nu"],"ね":["ne"],"の":["no"],
  "は":["ha"],"ひ":["hi"],"ふ":["fu","hu"],"へ":["he"],"ほ":["ho"],
  "ま":["ma"],"み":["mi"],"む":["mu"],"め":["me"],"も":["mo"],
  "や":["ya"],"ゆ":["yu"],"よ":["yo"],
  "ら":["ra"],"り":["ri"],"る":["ru"],"れ":["re"],"ろ":["ro"],
  "わ":["wa"],"を":["wo"],
  "が":["ga"],"ぎ":["gi"],"ぐ":["gu"],"げ":["ge"],"ご":["go"],
  "ざ":["za"],"じ":["ji","zi"],"ず":["zu"],"ぜ":["ze"],"ぞ":["zo"],
  "だ":["da"],"ぢ":["di"],"づ":["du"],"で":["de"],"ど":["do"],
  "ば":["ba"],"び":["bi"],"ぶ":["bu"],"べ":["be"],"ぼ":["bo"],
  "ぱ":["pa"],"ぴ":["pi"],"ぷ":["pu"],"ぺ":["pe"],"ぽ":["po"],
  "きゃ":["kya"],"きゅ":["kyu"],"きょ":["kyo"],
  "しゃ":["sha","sya"],"しゅ":["shu","syu"],"しょ":["sho","syo"],
  "ちゃ":["cha","tya","cya"],"ちゅ":["chu","tyu","cyu"],"ちょ":["cho","tyo","cyo"],
  "にゃ":["nya"],"にゅ":["nyu"],"にょ":["nyo"],
  "ひゃ":["hya"],"ひゅ":["hyu"],"ひょ":["hyo"],
  "みゃ":["mya"],"みゅ":["myu"],"みょ":["myo"],
  "りゃ":["rya"],"りゅ":["ryu"],"りょ":["ryo"],
  "ぎゃ":["gya"],"ぎゅ":["gyu"],"ぎょ":["gyo"],
  "じゃ":["ja","zya","jya"],"じゅ":["ju","zyu","jyu"],"じょ":["jo","zyo","jyo"],
  "びゃ":["bya"],"びゅ":["byu"],"びょ":["byo"],
  "ぴゃ":["pya"],"ぴゅ":["pyu"],"ぴょ":["pyo"],
};

// かなを「音の単位」の列に分解する。っ と ん は次の音を見て綴りを決める
function parseKana(kana) {
  const units = [];
  for (let i = 0; i < kana.length; i++) {
    const two = kana.slice(i, i + 2);
    if (KANA[two]) { units.push({ alts: KANA[two] }); i++; continue; }
    const ch = kana[i];
    if (ch === "っ" || ch === "ん") { units.push({ kana: ch, alts: null }); continue; }
    units.push({ alts: KANA[ch] });
  }
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.alts) continue;
    const next = units[i + 1];
    if (u.kana === "っ") {
      // 次の音の頭の子音を重ねる（っき → k、っち → c か t）
      u.alts = next ? [...new Set(next.alts.map(a => a[0]))] : ["xtu"];
    } else {
      // ん: 次が母音・や行・な行なら na行と紛れるため nn 必須。語末やそれ以外は n でも nn でもよい
      const nnOnly = next && next.alts.some(a => /^[aiueoyn]/.test(a));
      u.alts = nnOnly ? ["nn"] : ["n", "nn"];
    }
  }
  return units;
}

// 単語プール: tier 0 = 短い, 2 = 長い
const WORDS = [
  [ // tier 0
    ["星","ほし"],["月","つき"],["空","そら"],["雨","あめ"],["風","かぜ"],
    ["夢","ゆめ"],["海","うみ"],["山","やま"],["花","はな"],["雪","ゆき"],
    ["音","おと"],["夜","よる"],["光","ひかり"],["朝","あさ"],["炎","ほのお"],
  ],
  [ // tier 1
    ["流星","りゅうせい"],["宇宙","うちゅう"],["銀河","ぎんが"],["彗星","すいせい"],
    ["惑星","わくせい"],["星座","せいざ"],["隕石","いんせき"],["衛星","えいせい"],
    ["太陽","たいよう"],["重力","じゅうりょく"],["軌道","きどう"],["満月","まんげつ"],
    ["北極星","ほっきょくせい"],["天の川","あまのがわ"],
  ],
  [ // tier 2
    ["流れ星","ながれぼし"],["望遠鏡","ぼうえんきょう"],["大気圏","たいきけん"],
    ["天文台","てんもんだい"],["無重力","むじゅうりょく"],["超新星","ちょうしんせい"],
    ["人工衛星","じんこうえいせい"],["宇宙飛行士","うちゅうひこうし"],
    ["天体観測","てんたいかんそく"],["星屑","ほしくず"],
  ],
].map(tier => tier.map(([jp, kana]) => {
  const units = parseKana(kana);
  return {
    jp, kana, units,
    disp: units.map(u => u.alts[0]).join(""),
    heads: [...new Set(units[0].alts.map(a => a[0]))],
  };
}));

function advanceUnit(m) { m.unitIdx++; m.buf = ""; }

// 状態を変えずに、文字 ch を受け付けられるか判定
function canAccept(m, ch) {
  const units = m.word.units;
  const u = units[m.unitIdx], nb = m.buf + ch;
  if (u.alts.some(a => a.startsWith(nb))) return true;
  // 「n」1打でんを確定し、次の音の頭として解釈できるケース
  return u.alts.includes(m.buf) && m.unitIdx + 1 < units.length &&
    units[m.unitIdx + 1].alts.some(a => a.startsWith(ch));
}

// 文字を1つ入力する。戻り値: "miss" | "hit" | "kill"
function acceptChar(m, ch) {
  if (!canAccept(m, ch)) return "miss";
  const units = m.word.units;
  let u = units[m.unitIdx];
  if (!u.alts.some(a => a.startsWith(m.buf + ch))) {
    advanceUnit(m);
    u = units[m.unitIdx];
  }
  m.buf += ch; m.typedStr += ch;
  // 綴りが確定したら次の音へ。ただし単語の途中では、さらに長い綴り（nn等）の
  // 可能性が残る場合は次の文字が来るまで確定を待つ（次の音へ移る際に別途解決される）。
  // 単語の最後の音なら、その先の文字で解決しようがないので即確定する。
  const isLastUnit = m.unitIdx === units.length - 1;
  if (u.alts.includes(m.buf) && (isLastUnit || !u.alts.some(a => a.length > m.buf.length && a.startsWith(m.buf)))) {
    advanceUnit(m);
  }
  return m.unitIdx >= units.length ? "kill" : "hit";
}

// 残りのタイプ目安を表示用に組み立てる（打ちかけの綴りに追従する）
function remainingText(m) {
  const units = m.word.units;
  let s = "";
  for (let i = m.unitIdx; i < units.length; i++) {
    const u = units[i];
    if (i === m.unitIdx && m.buf) {
      const alt = u.alts.find(a => a.startsWith(m.buf)) || u.alts[0];
      s += alt.slice(m.buf.length);
    } else s += u.alts[0];
  }
  return s;
}

// 星空の背景
const stars = Array.from({length: 160}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.4 + 0.3, tw: Math.random() * Math.PI * 2,
}));

const GROUND_H = 70;
let state = "title"; // title | play | over
let meteors, particles, floaters, score, combo, maxCombo, kills, level, hp;
let spawnTimer, spawnInterval, lockedMeteor, shake, lastTime;

function reset() {
  meteors = []; particles = []; floaters = [];
  score = 0; combo = 0; maxCombo = 0; kills = 0; level = 1; hp = 5;
  spawnTimer = 0; spawnInterval = 2.4; lockedMeteor = null; shake = 0;
  updateHud();
}

const TIER_WEIGHT = [3, 2, 1]; // tier0が出やすく、上のtierほど珍しい

function pickWord() {
  const maxTier = level >= 6 ? 2 : level >= 3 ? 1 : 0;
  const active = new Set(meteors.flatMap(m => m.word.heads));
  const pool = [];
  for (let t = 0; t <= maxTier; t++) {
    for (let i = 0; i < TIER_WEIGHT[t]; i++) pool.push(...WORDS[t]);
  }
  // 頭文字が今飛んでいるどの単語とも被らない候補だけに絞る
  // （最初の1文字だけでどの流星を狙うか一意に決まるようにするため）
  const candidates = pool.filter(w => !w.heads.some(h => active.has(h)));
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function spawnMeteor() {
  const word = pickWord();
  if (!word) return false; // 頭文字の空きがないので今回は見送り
  const x = 80 + Math.random() * (W - 160);
  meteors.push({
    word, unitIdx: 0, buf: "", typedStr: "",
    x, y: -30,
    vx: (Math.random() - 0.5) * 30,
    vy: (34 + level * 7) * (0.85 + Math.random() * 0.3),
    trail: [],
  });
  return true;
}

function explode(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 220;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.6, age: 0, color,
      r: 1.5 + Math.random() * 2.5,
    });
  }
}

function floatText(x, y, text, color) {
  floaters.push({ x, y, text, color, age: 0, life: 0.9 });
}

function killMeteor(m) {
  const idx = meteors.indexOf(m);
  if (idx >= 0) meteors.splice(idx, 1);
  combo++;
  maxCombo = Math.max(maxCombo, combo);
  kills++;
  const pts = m.word.disp.length * 10 * Math.min(combo, 10);
  score += pts;
  explode(m.x, m.y, "#7fc4ff", 26);
  explode(m.x, m.y, "#ffd579", 14);
  floatText(m.x, m.y - 20, "+" + pts, "#ffd579");
  if (kills % 8 === 0) {
    level++;
    spawnInterval = Math.max(0.75, spawnInterval - 0.18);
    floatText(W / 2, H * 0.3, "LEVEL " + level + "!", "#9fd4ff");
  }
  updateHud();
}

function meteorImpact(m) {
  const idx = meteors.indexOf(m);
  if (idx >= 0) meteors.splice(idx, 1);
  if (lockedMeteor === m) lockedMeteor = null;
  hp--; combo = 0; shake = 14;
  explode(m.x, H - GROUND_H, "#ff7a5c", 34);
  updateHud();
  if (hp <= 0) gameOver();
}

function updateHud() {
  document.getElementById("score").textContent = "SCORE " + score;
  document.getElementById("level").textContent = "LEVEL " + level;
  document.getElementById("hp").textContent = "♥".repeat(Math.max(0, hp)) + "♡".repeat(5 - Math.max(0, hp));
  const comboEl = document.getElementById("combo");
  if (combo >= 2) { comboEl.classList.remove("hidden"); comboEl.textContent = combo + " COMBO!"; }
  else comboEl.classList.add("hidden");
}

// ===== 自己ベストランキング（この端末のブラウザ内に保存） =====
const HS_KEY = "typingMeteor_highScores_pc";

function loadHighScores() {
  try { return JSON.parse(localStorage.getItem(HS_KEY)) || []; } catch { return []; }
}

function saveHighScore(entry) {
  const list = loadHighScores();
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  const top = list.slice(0, 5);
  try { localStorage.setItem(HS_KEY, JSON.stringify(top)); } catch {}
  return { top, rank: top.indexOf(entry) + 1 };
}

function renderHighScores(top, rank) {
  const el = document.getElementById("highScoreList");
  if (!top.length) { el.innerHTML = ""; return; }
  el.innerHTML = top.map((e, i) =>
    `<div class="hs-row${i + 1 === rank ? " hs-mine" : ""}">${i + 1}位　${e.score}点　Lv${e.level}</div>`
  ).join("");
}

function updateTitleBest() {
  const top = loadHighScores();
  document.getElementById("titleBest").textContent = top.length ? `自己ベスト ${top[0].score}点` : "";
}

function gameOver() {
  state = "over";
  document.getElementById("finalScore").textContent = "SCORE " + score;
  document.getElementById("finalStats").textContent =
    "撃墜 " + kills + " ／ 最大コンボ " + maxCombo + " ／ 到達レベル " + level;
  const entry = { score, level, date: Date.now() };
  const { top, rank } = saveHighScore(entry);
  renderHighScores(top, rank);
  document.getElementById("gameover").classList.remove("hidden");
  document.getElementById("hud").classList.add("hidden");
}

function startGame() {
  reset();
  state = "play";
  document.getElementById("title").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
}

addEventListener("keydown", (e) => {
  if (state !== "play") {
    if (e.code === "Space") { e.preventDefault(); startGame(); }
    return;
  }
  if (e.key.length !== 1 || !/[a-z]/i.test(e.key)) return;
  const ch = e.key.toLowerCase();

  if (lockedMeteor && !meteors.includes(lockedMeteor)) lockedMeteor = null;

  if (!lockedMeteor) {
    // 地面に近い順で、頭文字が一致する流星にロックオン
    const candidates = meteors
      .filter(m => canAccept(m, ch))
      .sort((a, b) => b.y - a.y);
    if (candidates.length) {
      lockedMeteor = candidates[0];
      const result = acceptChar(lockedMeteor, ch);
      if (result === "kill") { killMeteor(lockedMeteor); lockedMeteor = null; }
    } else {
      combo = 0; shake = Math.max(shake, 4); updateHud();
    }
    return;
  }

  const m = lockedMeteor;
  const result = acceptChar(m, ch);
  if (result === "kill") { killMeteor(m); lockedMeteor = null; }
  else if (result === "miss") { combo = 0; shake = Math.max(shake, 4); updateHud(); }
});

function update(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnTimer = spawnMeteor() ? spawnInterval : 0.3; }

  for (const m of [...meteors]) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < 50) m.vx = Math.abs(m.vx);
    if (m.x > W - 50) m.vx = -Math.abs(m.vx);
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 14) m.trail.shift();
    if (m.y >= H - GROUND_H) meteorImpact(m);
  }

  for (const p of [...particles]) {
    p.age += dt;
    if (p.age >= p.life) { particles.splice(particles.indexOf(p), 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 220 * dt; p.vx *= 0.985;
  }

  for (const f of [...floaters]) {
    f.age += dt;
    if (f.age >= f.life) floaters.splice(floaters.indexOf(f), 1);
    f.y -= 45 * dt;
  }

  shake = Math.max(0, shake - dt * 30);
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#05060f";
  ctx.fillRect(0, 0, W, H);

  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // 星空
  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.001 + s.tw));
    ctx.fillStyle = `rgba(220, 230, 255, ${a * 0.8})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面
  const gy = H - GROUND_H;
  const grad = ctx.createLinearGradient(0, gy, 0, H);
  grad.addColorStop(0, "#1b2440");
  grad.addColorStop(1, "#0a0e1e");
  ctx.fillStyle = grad;
  ctx.fillRect(0, gy, W, GROUND_H);
  ctx.strokeStyle = "rgba(120, 160, 255, 0.5)";
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();

  // 流星
  for (const m of meteors) {
    // 尾
    for (let i = 0; i < m.trail.length; i++) {
      const p = m.trail[i], f = i / m.trail.length;
      ctx.fillStyle = `rgba(120, 180, 255, ${f * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 * f, 0, Math.PI * 2);
      ctx.fill();
    }
    // 本体
    const locked = m === lockedMeteor;
    ctx.save();
    ctx.shadowColor = locked ? "#ffd579" : "#6fa8ff";
    ctx.shadowBlur = 18;
    ctx.fillStyle = locked ? "#ffe9b0" : "#cfe2ff";
    ctx.beginPath();
    ctx.arc(m.x, m.y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 単語ラベル
    ctx.textAlign = "center";
    ctx.font = "bold 22px 'Yu Gothic', 'Meiryo', sans-serif";
    ctx.fillStyle = locked ? "#ffd579" : "#eef3ff";
    ctx.shadowColor = "#000"; ctx.shadowBlur = 6;
    ctx.fillText(m.word.jp, m.x, m.y - 28);
    ctx.shadowBlur = 0;

    ctx.font = "15px Consolas, monospace";
    const done = m.typedStr, rest = remainingText(m);
    const wDone = ctx.measureText(done).width, wRest = ctx.measureText(rest).width;
    const startX = m.x - (wDone + wRest) / 2;
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd579";
    ctx.fillText(done, startX, m.y + 28);
    ctx.fillStyle = "rgba(200, 215, 255, 0.85)";
    ctx.fillText(rest, startX + wDone, m.y + 28);
  }

  // パーティクル
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // フロートテキスト
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.age / f.life;
    ctx.font = "bold 20px 'Yu Gothic', sans-serif";
    ctx.fillStyle = f.color;
    ctx.shadowColor = "#000"; ctx.shadowBlur = 5;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function loop(t) {
  const dt = Math.min(0.05, (t - (lastTime || t)) / 1000);
  lastTime = t;
  if (state === "play") update(dt);
  draw(t);
  requestAnimationFrame(loop);
}
reset();
updateTitleBest();
requestAnimationFrame(loop);
</script>
</body>
</html>
